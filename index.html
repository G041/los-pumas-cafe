<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Los Pumas Cafe — Cierre diario</title>
<link rel="icon" type="image/png" href="logo_circular.png?v=2">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
(function () {
  try {
    var t = localStorage.getItem('lospumas_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="viewport">
  <div id="fitWrap">
    <header class="top-bar">
      <div>
        <h1>Los Pumas Cafe</h1>
        <div class="subtitle">Cierre diario de Fabian</div>
      </div>
      <div class="top-bar-actions">
        <button class="history-toggle" id="logoutBtn" type="button" style="display:none;" aria-label="Cerrar sesión">Salir</button>
        <button class="history-toggle theme-toggle" id="themeToggleBtn" type="button" aria-label="Cambiar tema claro u oscuro"></button>
        <button class="history-toggle" id="menuBtn" type="button" aria-label="Ir al inicio">Menú</button>
      </div>
    </header>

    <div id="dateBar" class="date-bar"></div>
    <nav id="stepper" class="stepper" aria-label="Progreso del cierre diario"></nav>
    <main id="app"></main>
  </div>
</div>
<div id="liveRegion" class="sr-only" role="status" aria-live="polite"></div>

<!-- Sin bundler a propósito: scripts planos, en orden. app.js va último
     porque es el único que ejecuta algo al cargar. -->
<script src="js/icons.js"></script>
<script src="js/utils.js"></script>
<script src="js/weather.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/cierre.js"></script>
<script src="js/views/facturacion.js"></script>
<script src="js/views/platos.js"></script>
<script src="js/views/menuBuilder.js"></script>
<script src="js/app.js"></script>
</body>
</html>
