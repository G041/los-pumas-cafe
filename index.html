<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Los Pumas Cafe — Cierre diario</title>
<link rel="icon" type="image/png" href="logo_circular.png?v=2">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
(function () {
  try {
    var t = localStorage.getItem('lospumas_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #f3f5f8;
    --card: #ffffff;
    --card-border: #dde1e8;
    --text: #1b1f27;
    --muted: #667085;
    --accent: #3EB3EE;
    --accent-text: #0f1115;
    --ok: #1a9d63;
    --danger: #d94343;
    --locked: #b7bcc4;
    --input-bg: #eef1f5;
    --overlay-top: rgba(255,255,255,0.4);
    --overlay-bottom: rgba(255,255,255,0.58);
    --done-bg: #d9f3e5;
    --done-border: #a7e3c1;
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --card: #171a21;
    --card-border: #2a2e38;
    --text: #eef0f3;
    --muted: #9aa1ad;
    --accent: #3EB3EE;
    --accent-text: #0f1115;
    --ok: #3ecf8e;
    --danger: #ff6b6b;
    --locked: #4a505c;
    --input-bg: #0c0e12;
    --overlay-top: rgba(10,11,14,0.4);
    --overlay-bottom: rgba(10,11,14,0.58);
    --done-bg: #163d2c;
    --done-border: #1f5c40;
  }
  * { box-sizing: border-box; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  html { font-size: 21px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      linear-gradient(var(--overlay-top), var(--overlay-bottom)),
      url('los-pumas-cafe.jpg') center / cover no-repeat fixed;
    color: var(--text);
  }
  .viewport {
    height: 100%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  #fitWrap {
    width: 100%;
    max-width: 560px;
    transform-origin: center center;
  }
  #fitWrap.wide { max-width: 900px; }
  #fitWrap.menu-wide { max-width: 1200px; }

  /* ---------- Screen change: Slide + Fade + Stagger ---------- */
  @keyframes screenSlideFadeIn {
    from { opacity: 0; transform: translateX(28px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .screen-enter { animation: screenSlideFadeIn .7s cubic-bezier(.4,0,.2,1); }

  @keyframes staggerChildIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .stagger-child { animation: staggerChildIn .6s ease both; }

  .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 1.7rem; margin: 0 0 2px; }
  .subtitle { color: var(--muted); font-size: 1rem; }
  .history-toggle {
    flex: none;
    width: auto;
    padding: 10px 14px;
    font-size: 0.9rem;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text);
  }

  /* fecha */
  .date-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 16px;
    margin-bottom: 12px;
    font-size: 1.05rem;
  }
  .date-bar strong { font-size: 1.15rem; }
  .date-picker-btn {
    flex: none;
    width: auto;
    padding: 8px 14px;
    font-size: 0.95rem;
    background: var(--accent);
    color: var(--accent-text);
  }
  .hidden-date-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* stepper */
  .stepper {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    margin-bottom: 12px;
    padding-bottom: 4px;
  }
  .step-pill {
    flex: 0 0 auto;
    padding: 6px 11px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--muted);
    white-space: nowrap;
  }
  .step-pill.done { background: var(--done-bg); border-color: var(--done-border); color: var(--ok); }
  .step-pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 18px;
  }

  /* ledger table */
  table.ledger { width: 100%; border-collapse: collapse; }
  table.ledger td { padding: 8px 6px; font-size: 1.05rem; vertical-align: middle; }
  table.ledger tr.locked td { color: var(--locked); }
  table.ledger .op { width: 1.4em; text-align: center; color: var(--muted); font-weight: 700; font-size: 1.1rem; }
  table.ledger .label { text-align: left; }
  table.ledger .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  table.ledger tr.subtotal td { border-top: 2px solid var(--card-border); font-weight: 700; padding-top: 10px; }
  table.ledger tr.final-row td { border-top: 2px solid var(--accent); padding-top: 12px; font-size: 1.35rem; }
  table.ledger tr.final-row .val { color: var(--ok); }
  table.ledger tr.final-row .val.negative { color: var(--danger); }
  table.ledger .val input {
    width: 100%;
    max-width: 200px;
    text-align: right;
    padding: 8px 10px;
    font-size: 1.05rem;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--input-bg);
    color: var(--text);
  }
  table.ledger .note-inline { font-size: 0.78rem; color: var(--muted); display: block; margin-top: 3px; font-weight: 400; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .controls button { min-width: 120px; }
  button {
    padding: 12px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    flex: 1;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:not(:disabled):hover { transform: scale(1.05); box-shadow: 0 0 0 3px rgba(62, 179, 238, 0.35); }
  button.secondary { background: transparent; border: 1px solid var(--card-border); color: var(--text); }
  button.link-btn { background: none; border: none; color: var(--accent); font-size: 0.95rem; width: auto; padding: 4px; flex: none; }

  .error { color: var(--danger); font-size: 0.9rem; margin-top: 8px; }
  .success { color: var(--ok); font-weight: 700; text-align: center; font-size: 1.25rem; margin-bottom: 14px; }

  .pw-input {
    width: 100%;
    margin-top: 14px;
    padding: 10px 12px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--input-bg);
    color: var(--text);
  }
  .retry-btn { margin-top: 14px; }
  .remember-me-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    color: var(--muted);
    font-size: 0.9rem;
    cursor: pointer;
  }
  .remember-me-label input { margin: 0; }
  .gate-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 14px; text-align: center; }

  .menu-buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }

  .month-tab {
    flex: 0 0 auto;
    padding: 6px 11px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
  }
  .month-tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .billing-table-wrap { max-height: 58vh; overflow-y: auto; overflow-x: hidden; margin: 4px 0 12px; }

  .billing-table-wrap,
  .plato-search-results,
  .menu-textarea {
    scrollbar-width: thin;
    scrollbar-color: var(--card-border) transparent;
  }
  .billing-table-wrap::-webkit-scrollbar,
  .plato-search-results::-webkit-scrollbar,
  .menu-textarea::-webkit-scrollbar { width: 8px; height: 8px; }
  .billing-table-wrap::-webkit-scrollbar-track,
  .plato-search-results::-webkit-scrollbar-track,
  .menu-textarea::-webkit-scrollbar-track { background: transparent; }
  .billing-table-wrap::-webkit-scrollbar-thumb,
  .plato-search-results::-webkit-scrollbar-thumb,
  .menu-textarea::-webkit-scrollbar-thumb {
    background-color: var(--card-border);
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  table.billing {
    table-layout: fixed;
    width: 100%;
    border-collapse: collapse;
  }
  table.billing th, table.billing td {
    text-align: right;
    border-bottom: 1px solid var(--card-border);
    white-space: normal;
    word-break: break-word;
    font-size: 0.78rem;
    padding: 6px 5px;
  }
  table.billing th:first-child, table.billing td:first-child { text-align: left; }
  tr.billing-total td { font-weight: 700; border-top: 2px solid var(--accent); padding-top: 16px; color: var(--ok); }
  tr.plato-row { cursor: pointer; }
  tr.plato-row:hover td { background: var(--input-bg); }

  .menu-builder-layout { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .menu-editor { flex: 2.2 1 320px; min-width: 320px; }
  .menu-textarea {
    width: 100%;
    min-height: 68vh;
    resize: vertical;
    padding: 12px;
    font-size: 1rem;
    font-family: inherit;
    line-height: 1.5;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: #ffffff;
    color: #1b1f27;
  }
  .menu-search { flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px; }
  .plato-category-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .plato-search-results { max-height: 40vh; overflow-y: auto; border: 1px solid var(--card-border); border-radius: 10px; }
  .plato-search-item { padding: 10px 12px; border-bottom: 1px solid var(--card-border); cursor: pointer; }
  .plato-search-item:last-child { border-bottom: none; }
  .plato-search-item:hover { background: var(--card); }
  .plato-search-name { font-weight: 600; }
  .plato-search-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .plato-search-empty { padding: 14px; text-align: center; color: var(--muted); }
  .postres-btn {
    background: var(--card);
    border: 1px dashed var(--card-border);
    color: var(--text);
    flex: none;
    padding: 20px 12px;
    font-size: 1.1rem;
    border-radius: 10px;
  }
  .postres-btn-compact { flex: none; min-height: auto; font-size: 1rem; border-style: solid; }
  .new-plato-row { margin-bottom: 10px; }
  .new-plato-name { font-weight: 600; margin-bottom: 4px; }
  .theme-toggle { font-size: 1rem; padding: 10px 12px; }

  /* postres modal */
  .postres-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .postres-modal {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px 20px;
    width: 100%;
    max-width: 760px;
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .postres-grid {
    display: grid;
    grid-auto-rows: 1fr;
    gap: 8px;
    overflow-y: auto;
  }
  .postre-chip {
    padding: 12px 8px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--input-bg);
    color: var(--text);
    text-align: center;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .postre-chip.selected { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .plato-delete-btn {
    padding: 4px 10px;
    font-size: 0.95rem;
    font-weight: 800;
    min-width: auto;
    background: var(--danger);
    border: none;
    color: #ffffff;
  }

  /* ---------- Dashboard ---------- */
  #fitWrap.dashboard { max-width: 1360px; }
  html.dash-mode { overflow-y: auto; height: auto; }
  html.dash-mode body { overflow-y: auto; height: auto; }
  html.dash-mode .viewport { height: auto; min-height: 100vh; align-items: flex-start; padding: 20px 12px 48px; }

  .dashboard {
    --viz-series-1: #2a78d6;
    --viz-series-2: #eb6834;
    --viz-series-3: #1baf7a;
    --viz-series-4: #4a3aa7;
    --viz-muted-bar: #d7dbe2;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  :root[data-theme="dark"] .dashboard {
    --viz-series-1: #3987e5;
    --viz-series-2: #d95926;
    --viz-series-3: #199e70;
    --viz-series-4: #9085e9;
    --viz-muted-bar: #2e333d;
  }

  .dash-hero {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px 22px;
  }
  .dash-hero img { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; flex: none; }
  .dash-hero-text { flex: 1; min-width: 200px; }
  .dash-hero-greeting { font-size: 1.25rem; font-weight: 700; }
  .dash-hero-sub { color: var(--muted); font-size: 0.92rem; margin-top: 2px; }
  .dash-hero-status {
    flex: none;
    max-width: 100%;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 10px 16px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.9rem;
  }
  .dash-hero-status.ok { background: var(--done-bg); color: var(--ok); }
  .dash-hero-status.pending { background: var(--input-bg); color: var(--muted); }
  .dash-hero-status button { width: auto; padding: 9px 15px; font-size: 0.85rem; }

  .dash-kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }
  .dash-kpi {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .dash-kpi-label { color: var(--muted); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .dash-kpi-value { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .dash-kpi-delta { font-size: 0.82rem; font-weight: 700; display: flex; align-items: center; gap: 4px; }
  .dash-kpi-delta.up { color: var(--ok); }
  .dash-kpi-delta.down { color: var(--danger); }
  .dash-kpi-delta.flat { color: var(--muted); font-weight: 600; }

  .dash-grid {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 860px) { .dash-grid { grid-template-columns: minmax(0, 1fr); } }

  .dash-widget {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px 20px;
    min-width: 0;
  }
  .dash-widget-title { font-size: 1.02rem; font-weight: 700; margin-bottom: 2px; }
  .dash-widget-sub { color: var(--muted); font-size: 0.82rem; margin-bottom: 12px; }

  .dash-actions { display: flex; flex-direction: column; gap: 10px; }
  .dash-action-tile {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--input-bg);
    color: var(--text);
    text-align: left;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .dash-action-icon {
    flex: none;
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem;
    color: #ffffff;
  }

  .dash-chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .dash-chart-wrap { position: relative; }
  .dash-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.76rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    transform: translate(-50%, -115%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 5;
  }
  .dash-tooltip.visible { opacity: 1; }
  .dash-tooltip .tt-date { color: var(--muted); font-size: 0.68rem; }
  .dash-tooltip .tt-val { font-weight: 700; }

  .dash-weekday-bars { display: flex; align-items: flex-end; gap: 8px; height: 140px; }
  .dash-weekday-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .dash-weekday-value, .dash-weekday-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .dash-weekday-value { font-size: 0.7rem; font-weight: 700; color: var(--muted); visibility: hidden; }
  .dash-weekday-col.best .dash-weekday-value { color: var(--viz-series-1); visibility: visible; }
  .dash-weekday-bar { width: 100%; max-width: 34px; border-radius: 8px 8px 3px 3px; background: var(--viz-muted-bar); min-height: 4px; }
  .dash-weekday-col.best .dash-weekday-bar { background: var(--viz-series-1); }
  .dash-weekday-label { font-size: 0.76rem; color: var(--muted); font-weight: 600; }
  .dash-weekday-col.best .dash-weekday-label { color: var(--text); }

  .dash-split-bar { display: flex; height: 30px; border-radius: 10px; overflow: hidden; background: var(--input-bg); gap: 2px; }
  .dash-split-seg { display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 0.76rem; font-weight: 700; }
  .dash-split-seg.cash { background: var(--viz-series-1); border-radius: 8px 0 0 8px; }
  .dash-split-seg.card { background: var(--viz-series-2); border-radius: 0 8px 8px 0; }
  .dash-split-legend { display: flex; gap: 18px; margin-top: 12px; flex-wrap: wrap; }
  .dash-split-legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.84rem; }
  .dash-split-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .dash-split-dot.cash { background: var(--viz-series-1); }
  .dash-split-dot.card { background: var(--viz-series-2); }

  table.dash-recent { width: 100%; border-collapse: collapse; }
  table.dash-recent th, table.dash-recent td { text-align: right; padding: 7px 6px; font-size: 0.85rem; border-bottom: 1px solid var(--card-border); }
  table.dash-recent th:first-child, table.dash-recent td:first-child { text-align: left; }
  table.dash-recent th { color: var(--muted); font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; }
  table.dash-recent td.result-pos { color: var(--ok); font-weight: 700; }
  table.dash-recent td.result-neg { color: var(--danger); font-weight: 700; }

  .dash-empty { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 20px 0; }
  .dash-link-btn { width: auto; flex: none; padding: 8px 12px; font-size: 0.82rem; }
</style>
</head>
<body>
<div class="viewport">
  <div id="fitWrap">
    <div class="top-bar">
      <div>
        <h1>Los Pumas Cafe</h1>
        <div class="subtitle">Cierre diario de Fabian</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="history-toggle" id="logoutBtn" type="button" style="display:none;">🔒 Salir</button>
        <button class="history-toggle theme-toggle" id="themeToggleBtn" type="button">🌙</button>
        <button class="history-toggle" id="menuBtn">☰ Menú</button>
      </div>
    </div>

    <div id="dateBar" class="date-bar"></div>
    <div id="stepper" class="stepper"></div>
    <div id="app"></div>
  </div>
</div>

<script>
const WORKER_BASE = 'https://los-pumas-worker.los-pumas-cafe.workers.dev';
const SESSION_STORAGE_KEY = 'lospumas_session_token';

let sessionToken = localStorage.getItem(SESSION_STORAGE_KEY) || '';
let authStatus = 'gate'; // 'gate' | 'checking' | 'ready'
let authError = '';
let rememberMe = true;

function storeSessionToken(token, remember) {
  sessionToken = token;
  try {
    if (remember) localStorage.setItem(SESSION_STORAGE_KEY, token);
    else localStorage.removeItem(SESSION_STORAGE_KEY);
  } catch (e) {}
}
function clearSessionToken() {
  sessionToken = '';
  try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  lines.shift(); // header
  return lines.map(line => {
    const [date, C, V, F, T, opening, final, platos, fiscal] = line.split(',');
    const Cn = Number(C), Vn = Number(V), Fn = Number(F);
    return {
      dateISO: date,

      s3: Cn + Vn + Fn,
      opening: Number(opening),
      final: Number(final),

      fiscal: Number(fiscal),
    };
  });
}
function fmt(n) { return Number(n).toLocaleString('es-AR'); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// nombre/categoria are free text and may contain commas, so platos.csv is
// quoted-CSV — mirrors worker/src/index.js parseCSVLine/csvEscapeField.
function parseCSVLine(line) {
  const fields = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"' && line[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ',') {
      fields.push(field);
      field = '';
    } else {
      field += c;
    }
  }
  fields.push(field);
  return fields;
}
function parsePlatosCSV(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  lines.shift(); // header
  return lines.map(line => {
    const [nombre, categoria, ultimaFecha, ultimoPrecio] = parseCSVLine(line);
    return { nombre, categoria, ultimaFecha, ultimoPrecio: Number(ultimoPrecio) };
  });
}

// Wraps each selected tart type in {} and joins them the way a spoken Spanish
// list would: commas between all but the last, "o" before the last one.
function joinTartaTypes(types) {
  const braced = types.map(t => `{${t}}`);
  if (braced.length === 0) return '';
  if (braced.length === 1) return braced[0];
  return braced.slice(0, -1).join(', ') + ' o ' + braced[braced.length - 1];
}
function normalizeName(s) {
  return String(s).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function findPlatoByName(nombre) {
  const norm = normalizeName(nombre);
  return platosDb.find(p => normalizeName(p.nombre) === norm);
}
// Lines look like "nombre plato $ precio" - split on the LAST '$' so dish
// names are free to contain anything except the literal separator.
function parseMenuLines(text) {
  const parsed = [];
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    const sepIdx = line.lastIndexOf('$');
    if (sepIdx === -1) return;
    const nombre = line.slice(0, sepIdx).trim().replace(/^\d+\)\s*/, '');
    const precio = Number(line.slice(sepIdx + 1).trim().replace(/[^\d.]/g, ''));
    if (!nombre || !precio || isNaN(precio) || precio <= 0) return;
    parsed.push({ nombre, precio });
  });
  return parsed;
}
// counts how many "N) nombre $ precio" lines are already in the menu, so the
// next plato added via the search results gets the correct running number.
function countNumberedPlatos(text) {
  return text.split(/\r?\n/).filter(l => /^\d+\)\s*\S/.test(l.trim())).length;
}
function undoLastPlato() {
  const lines = menuBuilderState.text.split(/\r?\n/);
  let idx = -1;
  for (let i = lines.length - 1; i >= 0; i--) {
    if (/^\d+\)\s*\S/.test(lines[i].trim())) { idx = i; break; }
  }
  if (idx === -1) return;
  lines.splice(idx, 1);
  // collapse the now-adjacent blank lines left behind by the removed entry
  const cleaned = lines.join('\n').replace(/\n{3,}/g, '\n\n').replace(/\s+$/, '');
  menuBuilderState.text = cleaned;
}
async function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    return true;
  } catch (e) {
    return false;
  }
}
// KV holds the whole platos catalog under one key, so concurrent writes would
// clobber each other's read-modify-write - these MUST run sequentially.
async function executeMenuSave(updates) {
  menuBuilderState.saving = true;
  menuBuilderState.error = '';
  renderAll();

  try {
    for (const plato of updates) {
      const res = await fetch(WORKER_BASE + '/api/platos/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Session-Token': sessionToken },
        body: JSON.stringify({ plato }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        throw Object.assign(new Error(data.error || 'save_failed'), { code: data.error });
      }
      platosDb = platosDb.filter(p => p.nombre !== plato.nombre);
      platosDb.push(plato);
    }
    const copied = await copyToClipboard(menuBuilderState.text);
    menuBuilderState.saving = false;
    menuBuilderState.confirmingNew = null;
    menuBuilderState.pendingUpdates = null;
    menuBuilderState.success = copied ? 'copied' : 'saved_no_copy';
    renderAll();
    setTimeout(() => { menuBuilderState.success = false; renderAll(); }, 4000);
  } catch (e) {
    menuBuilderState.saving = false;
    if (e.code === 'invalid_session') { logout(); return; }
    menuBuilderState.error = errorMessage(e.code);
    renderAll();
  }
}
function onCopiarMenuClick() {
  const parsedLines = parseMenuLines(menuBuilderState.text);
  const updates = [];
  const newOnes = [];
  const seen = new Set();

  parsedLines.forEach(pl => {
    const existing = findPlatoByName(pl.nombre);
    if (existing) {
      if (Number(existing.ultimoPrecio) !== pl.precio) {
        updates.push({ nombre: existing.nombre, categoria: existing.categoria, ultimaFecha: isoToday(), ultimoPrecio: pl.precio });
      }
    } else {
      const key = normalizeName(pl.nombre);
      if (!seen.has(key)) {
        seen.add(key);
        newOnes.push({ nombre: pl.nombre, precio: pl.precio, categoria: '' });
      }
    }
  });

  if (!parsedLines.length) {
    menuBuilderState.error = 'El menú está vacío. Escribí al menos un plato con su precio.';
    renderAll();
    return;
  }

  if (newOnes.length) {
    menuBuilderState.confirmingNew = newOnes;
    menuBuilderState.pendingUpdates = updates;
    menuBuilderState.error = '';
    renderAll();
    return;
  }

  executeMenuSave(updates);
}

function cellContent(key, idx) {
  const meta = META[key];

  if (committed) {
    if (key === 'platos') return `${state.values.platos}`;
    return fmt(state.values[key]) + (key === 'opening' && state.openingSource === 'auto' ? '<span class="note-inline">(automático, de ayer)</span>' : '');
  }

  if (!active) return '—';

  // active row rendering
  if (key === 'opening') {
    if (isFirstOfMonth(state.dateISO)) {
      return `<input type="number" id="stepInput" step="any" min="0" placeholder="Apertura">`;
    }
    const prevIso = prevIsoDate(state.dateISO);
    const prevRecord = db.find(r => r.dateISO === prevIso);
    if (prevRecord) {
      state._autoOpening = prevRecord.s3;
      return `${fmt(prevRecord.s3)}<span class="note-inline">Automático, tomado de ayer (${toDisplayDate(prevIso)})</span>`;
    } else {
      state._autoOpening = null;
      return `<input type="number" id="stepInput" step="any" min="0" placeholder="Apertura">
        <span class="note-inline">No hay cierre de ayer guardado: ingresá manualmente.</span>`;
    }
  }
  if (key === 'platos') {

    if (key === 'F') {

const WEEKDAY_LABELS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

function ymOf(dateISO) { return dateISO.slice(0, 7); }
function prevYm(ym) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function computeDashboardStats() {
  const sorted = [...db].sort((a, b) => a.dateISO.localeCompare(b.dateISO));
  const sum = (arr, key) => arr.reduce((a, r) => a + (Number(r[key]) || 0), 0);

  const todayYm = isoToday().slice(0, 7);
  const thisMonth = sorted.filter(r => ymOf(r.dateISO) === todayYm);
  const lastMonth = sorted.filter(r => ymOf(r.dateISO) === prevYm(todayYm));

  const ventasThisMonth = sum(thisMonth, 's3');
  const ventasLastMonth = sum(lastMonth, 's3');
  // Compare daily averages, not raw totals: the current month is almost always
  // partial, so a totals comparison would look like a crash on day 2 of the month.
  const avgThisMonth = thisMonth.length > 0 ? ventasThisMonth / thisMonth.length : 0;
  const avgLastMonth = lastMonth.length > 0 ? ventasLastMonth / lastMonth.length : 0;
  const momPct = avgLastMonth > 0 ? ((avgThisMonth - avgLastMonth) / avgLastMonth * 100) : null;

  const platosThisMonth = sum(thisMonth, 'platos');
  const avgTicket = platosThisMonth > 0 ? Math.round(ventasThisMonth / platosThisMonth) : 0;
  const fiscalThisMonth = sum(thisMonth, 'fiscal');

  const cashThisMonth = sum(thisMonth, 'C');
  const cardThisMonth = sum(thisMonth, 'V');
  const ccTotal = cashThisMonth + cardThisMonth;
  const cashPct = ccTotal > 0 ? Math.round(cashThisMonth / ccTotal * 100) : 0;
  const cardPct = ccTotal > 0 ? 100 - cashPct : 0;

  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 29);
  const cutoffIso = new Date(cutoff - cutoff.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const trend = sorted.filter(r => r.dateISO >= cutoffIso);

  const weekdaySum = [0, 0, 0, 0, 0, 0, 0];
  const weekdayCount = [0, 0, 0, 0, 0, 0, 0];
  sorted.forEach(r => {
    const jsDay = new Date(r.dateISO + 'T00:00:00').getDay();
    const idx = (jsDay + 6) % 7; // Mon=0 .. Sun=6
    weekdaySum[idx] += r.s3;
    weekdayCount[idx] += 1;
  });
  const weekdayAvg = weekdaySum.map((s, i) => weekdayCount[i] ? s / weekdayCount[i] : 0);
  const hasWeekdayData = weekdayCount.some(c => c > 0);
  let bestIdx = 0;
  weekdayAvg.forEach((v, i) => { if (v > weekdayAvg[bestIdx]) bestIdx = i; });

  const recent = sorted.slice(-6).reverse();

  return {
    hasAnyData: sorted.length > 0,
    ventasThisMonth, momPct, platosThisMonth, avgTicket, fiscalThisMonth,
    cashThisMonth, cardThisMonth, cashPct, cardPct, ccTotal,
    trend, weekdayAvg, bestIdx, hasWeekdayData, recent,
  };
}

function buildSalesTrendChart(trend) {
  const w = 640, h = 220, padL = 46, padR = 10, padT = 14, padB = 26;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const n = trend.length;
  const values = trend.map(r => r.s3);
  const maxVal = Math.max(...values, 1) * 1.15;

  const points = trend.map((r, i) => {
    const x = n === 1 ? padL + innerW / 2 : padL + (i / (n - 1)) * innerW;
    const y = padT + innerH - (r.s3 / maxVal) * innerH;
    return { x, y, dateISO: r.dateISO, value: r.s3 };
  });
  const baseline = padT + innerH;
  const linePath = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaPath = `${linePath} L${points[n - 1].x.toFixed(1)},${baseline.toFixed(1)} L${points[0].x.toFixed(1)},${baseline.toFixed(1)} Z`;

  const gridLines = [0.25, 0.5, 0.75].map(f => {
    const y = padT + innerH * (1 - f);
    const val = Math.round(maxVal * f);
    return `<line x1="${padL}" x2="${w - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--card-border)" stroke-width="1" stroke-dasharray="3,4"/>
      <text x="${padL - 8}" y="${(y + 4).toFixed(1)}" font-size="10" text-anchor="end" fill="var(--muted)">${fmt(val)}</text>`;
  }).join('');

  const labelIdxs = [...new Set(n > 1 ? [0, Math.floor((n - 1) / 2), n - 1] : [0])];
  const xLabels = labelIdxs.map(i => {
    const p = points[i];
    return `<text x="${p.x.toFixed(1)}" y="${h - 6}" font-size="10" text-anchor="middle" fill="var(--muted)">${toDisplayDate(trend[i].dateISO).slice(0, 5)}</text>`;
  }).join('');

  const html = `
    <svg class="dash-chart-svg" viewBox="0 0 ${w} ${h}">
      <defs>
        <linearGradient id="dashAreaFade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--viz-series-1)" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="var(--viz-series-1)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <line x1="${padL}" x2="${w - padR}" y1="${baseline.toFixed(1)}" y2="${baseline.toFixed(1)}" stroke="var(--card-border)" stroke-width="1"/>
      <path d="${areaPath}" fill="url(#dashAreaFade)" stroke="none"/>
      <path d="${linePath}" fill="none" stroke="var(--viz-series-1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <line class="dash-crosshair" x1="0" x2="0" y1="${padT}" y2="${baseline.toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3,3" style="opacity:0;"/>
      <circle class="dash-hover-dot" r="4.5" fill="var(--viz-series-1)" stroke="var(--card)" stroke-width="2" style="opacity:0;"/>
      ${xLabels}
    </svg>`;
  return { html, points, w, h };
}

    dot.style.opacity = 1;
    tooltip.querySelector('.tt-date').textContent = toDisplayDate(nearest.dateISO);
    tooltip.querySelector('.tt-val').textContent = '$ ' + fmt(nearest.value);
    tooltip.style.left = (nearest.x / chart.w * 100) + '%';
    tooltip.style.top = (nearest.y / chart.h * 100) + '%';
    tooltip.classList.add('visible');
  };

  svg.addEventListener('mousemove', (e) => {
    const rect = svg.getBoundingClientRect();
    const relX = e.clientX - rect.left;
    const svgX = (relX / rect.width) * chart.w;
    let nearest = points[0], bestDist = Infinity;
    points.forEach(p => { const d = Math.abs(p.x - svgX); if (d < bestDist) { bestDist = d; nearest = p; } });
    showPoint(nearest);
  });
  svg.addEventListener('mouseleave', () => {
    crosshair.style.opacity = 0;
    dot.style.opacity = 0;
    tooltip.classList.remove('visible');
  });
}

  overlay.querySelector('#confirmDeletePlatoBtn').onclick = deletePlato;

async function deletePlato() {
  const nombre = platosViewState.confirmDelete;
  platosViewState.deleting = true;
  platosViewState.error = '';
  renderAll();

  try {
    const res = await fetch(WORKER_BASE + '/api/platos/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Session-Token': sessionToken },
      body: JSON.stringify({ nombre }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      platosViewState.deleting = false;
      if (data.error === 'invalid_session') { logout(); return; }
      platosViewState.error = errorMessage(data.error);
      renderAll();
      return;
    }
    platosDb = platosDb.filter(p => p.nombre !== nombre);
    if (platoForm.editingNombre === nombre) platoForm = freshPlatoForm();
    platosViewState.deleting = false;
    platosViewState.confirmDelete = null;
    renderAll();
  } catch (e) {
    platosViewState.deleting = false;
    platosViewState.error = 'No se pudo conectar. Revisá tu conexión e intentá de nuevo.';
    renderAll();
  }
}

      </div>
    </div>`;
}

function wirePostresModal() {
  const overlay = appEl.querySelector('#postresOverlay');
  if (!overlay) return;

  overlay.querySelectorAll('.postre-chip').forEach(el => {
    el.onclick = () => {
      const nombre = el.dataset.nombre;
      const working = menuBuilderState.postresWorking;
      if (working.has(nombre)) working.delete(nombre); else working.add(nombre);
      renderAll();
    };
  });

  overlay.querySelector('#postresCancelBtn').onclick = () => {
    menuBuilderState.postresModalOpen = false;
    menuBuilderState.postresWorking = null;
    renderAll();
  };

  overlay.querySelector('#postresConfirmBtn').onclick = () => {
    menuBuilderState.selectedPostres = new Set(menuBuilderState.postresWorking);
    const line = platosDb
      .filter(p => p.categoria === 'Postre' && menuBuilderState.selectedPostres.has(p.nombre))
      .sort((a, b) => a.nombre.localeCompare(b.nombre))
      .map(p => p.nombre)
      .join(' / ');

    let current = menuBuilderState.text;
    if (menuBuilderState.lastPostresLine && current.includes(menuBuilderState.lastPostresLine)) {
      current = current.replace(menuBuilderState.lastPostresLine, line);
      if (!line) current = current.replace(/\s+$/, '');
    } else if (line) {
      if (current && !/\n\s*\n$/.test(current)) {
        current = current.replace(/\n*$/, '') + '\n\n';
      }
      current = current + line;
    }
    menuBuilderState.text = current;
    menuBuilderState.lastPostresLine = line;
    menuBuilderState.postresModalOpen = false;
    menuBuilderState.postresWorking = null;
    renderAll();
    const editor = appEl.querySelector('#menuEditor');
    if (editor) { editor.scrollTop = editor.scrollHeight; editor.focus(); }
  };
}

function renderMenuBuilderConfirmView() {
  const items = menuBuilderState.confirmingNew;
  const rowsHtml = items.map((it, i) => `
    <div class="new-plato-row">
      <div class="new-plato-name">${escapeHtml(it.nombre)} — $ ${fmt(it.precio)}</div>
      <input class="pw-input new-plato-categoria" data-idx="${i}" list="platoCategoriaList" placeholder="Categoría para este plato nuevo" value="${escapeHtml(it.categoria)}">
    </div>`).join('');
  const categoriaOptions = PLATO_CATEGORIAS.map(c => `<option value="${escapeHtml(c)}">`).join('');

  appEl.innerHTML = `
    <div class="card">
      <div class="gate-title">Platos nuevos detectados</div>
      <div style="color:var(--muted); margin-bottom:10px;">No encontramos estos platos en la base. Asigná una categoría para darlos de alta junto con el menú de hoy.</div>
      ${rowsHtml}
      <datalist id="platoCategoriaList">${categoriaOptions}</datalist>
      <div class="error">${menuBuilderState.error || ''}</div>

        <button id="confirmNewPlatosBtn" ${menuBuilderState.saving ? 'disabled' : ''}>${menuBuilderState.saving ? 'Guardando…' : 'Confirmar y copiar menú'}</button>
      </div>

  appEl.querySelectorAll('.new-plato-categoria').forEach(el => {

  });

    menuBuilderState.confirmingNew = null;
    menuBuilderState.pendingUpdates = null;

  };
  appEl.querySelector('#confirmNewPlatosBtn').onclick = () => {

    const newUpdates = menuBuilderState.confirmingNew.map(it => ({
      nombre: it.nombre, categoria: it.categoria.trim(), ultimaFecha: isoToday(), ultimoPrecio: it.precio,
    }));
    const allUpdates = [...(menuBuilderState.pendingUpdates || []), ...newUpdates];
    executeMenuSave(allUpdates);
  };
}

async function savePlato() {
  const nombre = (platoForm.nombre || '').trim();
  const categoria = (platoForm.categoria || '').trim();
  const precio = Number(platoForm.ultimoPrecio);

  if (!nombre) { platoForm.error = 'Ingresá el nombre del plato.'; renderAll(); return; }
  if (!categoria) { platoForm.error = 'Ingresá la categoría.'; renderAll(); return; }
  if (!platoForm.ultimoPrecio || isNaN(precio) || precio <= 0) { platoForm.error = 'Ingresá un precio válido.'; renderAll(); return; }

  const plato = { nombre, categoria, ultimaFecha: isoToday(), ultimoPrecio: precio };

  platoForm.saving = true;
  platoForm.error = '';
  renderAll();

  try {
    const res = await fetch(WORKER_BASE + '/api/platos/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Session-Token': sessionToken },
      body: JSON.stringify({ plato }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      platoForm.saving = false;
      if (data.error === 'invalid_session') { logout(); return; }
      platoForm.error = errorMessage(data.error);
      renderAll();
      return;
    }
    platosDb = platosDb.filter(p => p.nombre !== plato.nombre);
    platosDb.push(plato);
    platoForm = freshPlatoForm();
    renderAll();
  } catch (e) {
    platoForm.saving = false;
    platoForm.error = 'No se pudo conectar. Revisá tu conexión e intentá de nuevo.';
    renderAll();
  }
}

function renderFacturacionView() {
  dateBarEl.innerHTML = '';
  stepperEl.innerHTML = '';

  const grouped = groupByMonth();
  const monthKeys = Object.keys(grouped).sort().reverse();
  if (!facturacionMonth || !grouped[facturacionMonth]) {
    facturacionMonth = monthKeys[0] || isoToday().slice(0, 7);
  }
  const rows = (grouped[facturacionMonth] || []).slice().sort((a, b) => a.dateISO.localeCompare(b.dateISO));

  const sum = (key) => rows.reduce((acc, r) => acc + (Number(r[key]) || 0), 0);
  const totalF = sum('F'), totalT = sum('T'), totalFinal = sum('final'), totalPlatos = sum('platos');

  const tabsHtml = monthKeys.length
    ? monthKeys.map(ym => `<div class="month-tab ${ym === facturacionMonth ? 'active' : ''}" data-ym="${ym}">${monthLabel(ym)}</div>`).join('')
    : '<div class="month-tab">Sin datos todavía</div>';

  const rowsHtml = rows.length ? rows.map(r => `
    <tr>
      <td>${toDisplayDate(r.dateISO)}</td>
      <td>${fmt(r.C)}</td><td>${fmt(r.V)}</td><td>${fmt(r.F)}</td><td>${fmt(r.T)}</td>
      <td>${fmt(r.opening)}</td><td>${fmt(r.final)}</td><td>${r.platos}</td><td>${fmt(r.fiscal)}</td>
    </tr>`).join('') : `<tr><td colspan="9" style="text-align:center;color:var(--muted);">Sin entradas este mes</td></tr>`;

  appEl.innerHTML = `
    <div class="card">
      <div class="gate-title">Facturación de Los Pumas Cafe</div>
      <div class="stepper">${tabsHtml}</div>
      <div class="billing-table-wrap">
        <table class="billing">
          <colgroup>
            <col style="width:10ch"><col style="width:10ch"><col style="width:10ch">
            <col style="width:10ch"><col style="width:10ch"><col style="width:10ch">
            <col style="width:10ch"><col style="width:6ch"><col style="width:10ch">
          </colgroup>
          <thead><tr><th>Fecha</th><th>C</th><th>V</th><th>F</th><th>T</th><th>Apertura</th><th>Final</th><th>Platos</th><th>Fiscal</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
          <tfoot>
            <tr class="billing-total">
              <td>TOTAL</td><td>—</td><td>—</td>
              <td>${fmt(totalF)}</td><td>${fmt(totalT)}</td><td>—</td>
              <td>${fmt(totalFinal)}</td><td>${totalPlatos}</td><td>—</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="controls">
        <button class="secondary" id="backToMenuBtn">← Volver al menú</button>
        <button class="secondary" id="downloadCsvBtn">Descargar CSV</button>
        <button class="secondary" id="downloadXlsxBtn2">Descargar XLSX</button>
      </div>
    </div>`;

  appEl.querySelectorAll('.month-tab[data-ym]').forEach(el => {
    el.onclick = () => { facturacionMonth = el.dataset.ym; renderAll(); };
  });
  appEl.querySelector('#backToMenuBtn').onclick = () => { view = 'menu'; renderAll(); };
  appEl.querySelector('#downloadCsvBtn').onclick = downloadCSV;
  appEl.querySelector('#downloadXlsxBtn2').onclick = downloadXLSX;
}

function renderApp() {
  if (state.saved) {
    appEl.innerHTML = `
      <div class="card">
        <div class="success">La información fue guardada correctamente, Fabian.</div>
        <div style="text-align:center; color:var(--muted); font-size:0.85rem; margin:-10px 0 14px;">Abriendo facturación en unos segundos…</div>
        <button id="newDayBtn">Cargar otro día</button>
        <button class="secondary" id="menuFromSavedBtn" style="margin-top:10px;">Volver al menú</button>
      </div>`;
    document.getElementById('newDayBtn').onclick = () => { clearTimeout(autoAdvanceTimer); state = freshState(); renderAll(); };
    document.getElementById('menuFromSavedBtn').onclick = () => { clearTimeout(autoAdvanceTimer); view = 'menu'; renderAll(); };
    return;
  }

  const isFinalStep = state.activeIndex === STEPS.length;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <table class="ledger">${buildRows()}</table>
    <div class="error">${state.error || ''}</div>
    <div class="controls">
      <button class="secondary" id="backToMenuFromCierreBtn" ${state.saving ? 'disabled' : ''}>← Volver al menú</button>
      <button class="secondary" id="backBtn" ${state.activeIndex === 0 || state.saving ? 'disabled' : ''}>← Atrás</button>
      <button id="confirmBtn" ${state.saving ? 'disabled' : ''}>${isFinalStep ? (state.saving ? 'Guardando…' : 'Guardar día') : 'Confirmar →'}</button>
    </div>
  `;
  appEl.innerHTML = '';
  appEl.appendChild(card);

  card.querySelector('#backToMenuFromCierreBtn').onclick = () => {
    if (state.saving) return;
    view = 'menu';
    renderAll();
  };

  card.querySelector('#backBtn').onclick = () => {
    if (state.activeIndex === 0 || state.saving) return;
    state.activeIndex -= 1;
    state.error = '';
    renderAll();
  };

  card.querySelector('#confirmBtn').onclick = onConfirm;

  const input = card.querySelector('#stepInput');
  if (input) {
    input.focus();
    input.addEventListener('keydown', e => { if (e.key === 'Enter') onConfirm(); });
  }
}

function onConfirm() {
  if (state.activeIndex === STEPS.length) {
    trySave();
    return;
  }
  const key = STEPS[state.activeIndex];
  const card = appEl.querySelector('.card');
  const input = card.querySelector('#stepInput');

  if (key === 'opening' && !isFirstOfMonth(state.dateISO) && state._autoOpening !== null && state._autoOpening !== undefined) {
    state.values.opening = state._autoOpening;
    state.openingSource = 'auto';
    state.error = '';
    state.activeIndex += 1;
    renderAll();
    return;
  }

  const raw = input ? input.value : '';
  const v = Number(raw);

  if (key === 'platos') {
    if (raw === '' || !Number.isInteger(v) || v <= 0 || v > 500) {
      state.error = 'Platos debe ser un número entero positivo, máximo 500.';
      renderAll();
      return;
    }
  } else {
    if (raw === '' || isNaN(v) || v <= 0) {
      state.error = 'Ingresá un número positivo.';
      renderAll();
      return;
    }
  }

  state.values[key] = v;
  if (key === 'opening') {
    state.openingSource = isFirstOfMonth(state.dateISO) ? 'manual' : 'manual-fallback';
  }
  state.error = '';
  state.activeIndex += 1;
  renderAll();
}

function errorMessage(code) {
  switch (code) {
    case 'bad_password': return 'Contraseña incorrecta.';
    case 'invalid_session': return 'Tu sesión expiró. Volvé a ingresar la contraseña.';
    case 'too_many_attempts': return 'Demasiados intentos fallidos. Esperá unos minutos y volvé a intentar.';
    case 'invalid_record': return 'Algún valor no es válido. Revisá los números e intentá de nuevo.';
    case 'invalid_plato': return 'Algún dato del plato no es válido. Revisá nombre, categoría y precio.';
    default: return 'No se pudo guardar. Revisá tu conexión e intentá de nuevo.';
  }
}

let autoAdvanceTimer = null;

async function trySave() {
  const existing = db.find(r => r.dateISO === state.dateISO);
  if (existing) {
    const ok = confirm(`Fabian, ya existe un cierre guardado para el ${toDisplayDate(state.dateISO)}. ¿Querés sobreescribirlo?`);
    if (!ok) return;
  }

  const record = {
    dateISO: state.dateISO,
    C: state.values.C, V: state.values.V, F: state.values.F, T: state.values.T,
    opening: state.values.opening,
    final: finalResult(),
    platos: state.values.platos,
    fiscal: state.values.fiscal,
  };

  state.saving = true;
  state.error = '';
  renderAll();

  try {
    const res = await fetch(WORKER_BASE + '/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Session-Token': sessionToken },
      body: JSON.stringify({ record }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      state.saving = false;
      if (data.error === 'invalid_session') { logout(); return; }
      state.error = errorMessage(data.error);
      renderAll();
      return;
    }
    db = db.filter(r => r.dateISO !== record.dateISO);
    db.push({ ...record, s3: s3() });
    db.sort((a, b) => a.dateISO.localeCompare(b.dateISO));
    state.saving = false;
    state.saved = true;
    renderAll();
    clearTimeout(autoAdvanceTimer);
    autoAdvanceTimer = setTimeout(() => {
      view = 'facturacion';
      facturacionMonth = record.dateISO.slice(0, 7);
      renderAll();
    }, 3000);
  } catch (e) {
    state.saving = false;
    state.error = 'No se pudo conectar. Revisá tu conexión e intentá de nuevo.';
    renderAll();
  }
}

function downloadXLSX() {
  const grouped = groupByMonth();
  const monthKeys = Object.keys(grouped).sort();
  const header = ['Fecha', 'C', 'V', 'F', 'T', 'Apertura', 'Final', 'Platos', 'Fiscal'];
  const wb = XLSX.utils.book_new();

  monthKeys.forEach(ym => {
    const rows = grouped[ym].slice().sort((a, b) => a.dateISO.localeCompare(b.dateISO));
    const aoa = [header];
    rows.forEach(r => aoa.push([toDisplayDate(r.dateISO), r.C, r.V, r.F, r.T, r.opening, r.final, r.platos, r.fiscal]));
    const totalF = rows.reduce((acc, r) => acc + r.F, 0);
    const totalT = rows.reduce((acc, r) => acc + r.T, 0);
    const totalFinal = rows.reduce((acc, r) => acc + r.final, 0);
    const totalPlatos = rows.reduce((acc, r) => acc + r.platos, 0);
    aoa.push(['TOTAL', '', '', totalF, totalT, '', totalFinal, totalPlatos, '']);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, monthLabel(ym).slice(0, 31));
  });

  if (monthKeys.length === 0) {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([header]), 'Sin datos');
  }

  XLSX.writeFile(wb, 'los_pumas_cafe.xlsx');
}

function downloadCSV() {
  const header = 'date,C,V,F,T,opening,final,platos,fiscal';
  const lines = [...db].sort((a, b) => a.dateISO.localeCompare(b.dateISO)).map(r =>
    [toDisplayDate(r.dateISO), r.C, r.V, r.F, r.T, r.opening, r.final, r.platos, r.fiscal].join(',')
  );
  const csv = [header, ...lines].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'los_pumas_cafe_db.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function fitToViewport() {
  if (view === 'menu') {
    fitWrapEl.style.transform = 'none';
    return;
  }
  fitWrapEl.style.transform = 'scale(1)';
  const availH = window.innerHeight - 24;
  const availW = window.innerWidth - 24;
  const rect = fitWrapEl.getBoundingClientRect();
  const scale = Math.min(1, availH / rect.height, availW / rect.width);
  fitWrapEl.style.transform = `scale(${scale})`;
}

function renderAll() {
  const screenKey = screenKeyFor();
  const screenChanged = screenKey !== lastScreenKey;
  lastScreenKey = screenKey;
  document.getElementById('logoutBtn').style.display = authStatus === 'ready' ? '' : 'none';
  if (authStatus !== 'ready') {
    dateBarEl.innerHTML = '';
    stepperEl.innerHTML = '';
    const checking = authStatus === 'checking';
    appEl.innerHTML = `
      <div class="card">
        <div class="gate-title">Fabian, ingresá la contraseña</div>
        <input type="password" id="gatePwInput" class="pw-input" placeholder="Contraseña" ${checking ? 'disabled' : ''}>
        <label class="remember-me-label">
          <input type="checkbox" id="gateRememberInput" ${rememberMe ? 'checked' : ''} ${checking ? 'disabled' : ''}>
          Mantener sesión iniciada
        </label>
        <div class="error">${authError || ''}</div>
        <button id="gateBtn" ${checking ? 'disabled' : ''}>${checking ? 'Verificando…' : 'Acceder al sistema'}</button>
      </div>`;
    const gateInput = appEl.querySelector('#gatePwInput');
    const gateBtn = appEl.querySelector('#gateBtn');
    const gateRemember = appEl.querySelector('#gateRememberInput');
    gateRemember.onchange = () => { rememberMe = gateRemember.checked; };
    const submit = () => { if (!gateInput.value) return; submitPassword(gateInput.value, gateRemember.checked); };
    gateBtn.onclick = submit;
    gateInput.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    if (!checking) gateInput.focus();
    if (screenChanged) playScreenTransition();
    requestAnimationFrame(fitToViewport);
    return;
  }
  fitWrapEl.classList.toggle('wide', view === 'facturacion' || view === 'platos');
  fitWrapEl.classList.toggle('menu-wide', view === 'menuBuilder');
  fitWrapEl.classList.toggle('dashboard', view === 'menu');
  document.documentElement.classList.toggle('dash-mode', view === 'menu');
  if (view === 'menu') {
    renderMenu();
  } else if (view === 'facturacion') {
    renderFacturacionView();
  } else if (view === 'platos') {
    renderPlatosView();
  } else if (view === 'menuBuilder') {
    renderMenuBuilderView();
  } else {
    renderDateBar();
    renderStepper();
    renderApp();
  }
  if (screenChanged) playScreenTransition();
  requestAnimationFrame(fitToViewport);
}

window.addEventListener('resize', fitToViewport);
window.addEventListener('orientationchange', () => setTimeout(fitToViewport, 100));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitToViewport);
}
document.getElementById('menuBtn').onclick = () => { view = 'menu'; renderAll(); };

function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'dark'; }
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('lospumas_theme', theme); } catch (e) {}
  document.getElementById('themeToggleBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
}
applyTheme(currentTheme());
document.getElementById('themeToggleBtn').onclick = () => {
  applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
};

async function submitPassword(pw, remember) {
  authStatus = 'checking';
  authError = '';
  renderAll();
  try {
    await login(pw, remember);
    [db, platosDb] = await Promise.all([fetchData(), fetchPlatos()]);
    authStatus = 'ready';
  } catch (e) {
    authStatus = 'gate';
    if (e.code === 'bad_password') authError = 'Contraseña incorrecta.';
    else if (e.code === 'too_many_attempts') authError = 'Demasiados intentos fallidos. Esperá unos minutos y volvé a intentar.';
    else authError = 'No se pudo conectar. Intentá de nuevo.';
    clearSessionToken();
  }
  renderAll();
}

function logout() {
  clearSessionToken();
  authStatus = 'gate';
  authError = '';
  db = null;
  platosDb = null;
  renderAll();
}

async function tryResumeSession() {
  if (!sessionToken) return;
  authStatus = 'checking';
  renderAll();
  try {
    [db, platosDb] = await Promise.all([fetchData(), fetchPlatos()]);
    authStatus = 'ready';
  } catch (e) {
    authStatus = 'gate';
    clearSessionToken();
  }
  renderAll();
}

document.getElementById('logoutBtn').onclick = logout;

renderAll();
tryResumeSession();
</script>
